<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>水草笔记 · Watergrass Notes</title>
    <meta name="description"
          content="千里水草的全科学习笔记知识库：Java、Spring、数据库、中间件、前端、DevOps、面试与通识笔记，支持分类浏览、章节搜索与速查口诀。">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>

<div class="app">
    <aside class="sidebar" id="sidebar" aria-label="笔记导航">
        <div class="brand">
            <a class="brand-mark" href="#/" aria-label="水草笔记首页">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <path d="M12 21c0-6 1-11 8-15-1 8-4 12-8 15Z" fill="currentColor" opacity=".9"/>
                    <path d="M12 21C9 15 6 12 3 10c1 6 4 10 9 11Z" fill="currentColor" opacity=".45"/>
                    <path d="M12 21v-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
                </svg>
            </a>
            <a class="brand-text" href="#/">
                <span class="brand-name">水草笔记</span>
                <span class="mono-label">Watergrass Notes</span>
            </a>
        </div>

        <button type="button" class="search-trigger" id="searchTrigger" aria-label="搜索笔记">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span>搜索笔记、章节、口诀</span>
            <kbd id="searchKbd">⌘K</kbd>
        </button>

        <nav class="nav-root" aria-label="视图">
            <a class="nav-item" href="#/" data-nav="home">
                <span class="nav-dot" aria-hidden="true"></span>全部笔记<span class="nav-count" data-count="all"></span>
            </a>
            <a class="nav-item" href="#/recent" data-nav="recent">
                <span class="nav-dot" aria-hidden="true"></span>最近更新<span class="nav-count"
                                                                              data-count="recent"></span>
            </a>
        </nav>

        <div class="sidebar-section">
            <p class="mono-label sidebar-heading">领域</p>
            <div class="domain-list" id="domainList"></div>
        </div>

        <div class="sidebar-section sidebar-tree">
            <p class="mono-label sidebar-heading">分类</p>
            <nav id="categoryTree" aria-label="笔记分类"></nav>
        </div>

        <footer class="sidebar-footer">
            <p class="sidebar-stats" id="sidebarStats"></p>
            <p class="sidebar-note">千里水草 · 全科学习笔记</p>
        </footer>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main" tabindex="-1">
        <header class="topbar">
            <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航" aria-expanded="false"
                    aria-controls="sidebar">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </button>
            <nav class="crumbs" id="crumbs" aria-label="当前位置"></nav>
            <button type="button" class="icon-btn topbar-search" id="topbarSearch" aria-label="搜索">
                <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                    <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                    <path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </button>
        </header>
        <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
        <div class="view" id="view">
            <div class="loading"><span class="spinner" aria-hidden="true"></span>
                <p class="mono-label">正在载入笔记</p></div>
        </div>
    </main>
</div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="搜索笔记">
    <div class="palette-panel">
        <div class="palette-input">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input type="search" id="paletteInput" placeholder="搜索标题、章节、口诀…" autocomplete="off"
                   spellcheck="false" aria-label="搜索关键词" aria-controls="paletteResults">
            <kbd>Esc</kbd>
        </div>
        <div class="palette-results" id="paletteResults" role="listbox" aria-label="搜索结果"></div>
        <div class="palette-footer">
            <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span><span id="paletteCount"></span>
        </div>
    </div>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭图片预览">✕</button>
    <img id="lightboxImg" alt="">
</div>

<div class="gate" id="gate" hidden>
    <form class="gate-panel" id="gateForm">
        <p class="mono-label">Watergrass Notes</p>
        <h1 class="gate-title">水草笔记</h1>
        <p class="gate-desc">千里水草的全科学习笔记。内容已加密，输入密码后阅读。</p>
        <label class="gate-label" for="gatePassword">访问密码</label>
        <input class="gate-input" type="password" id="gatePassword" autocomplete="current-password"
               aria-describedby="gateError" required>
        <p class="gate-error" id="gateError" role="status" aria-live="polite" hidden></p>
        <button class="gate-submit" type="submit" id="gateSubmit">解锁</button>
        <p class="gate-note">密码仅在本标签页会话内记住，关闭即失效。</p>
    </form>
</div>

<script src="crypto.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
