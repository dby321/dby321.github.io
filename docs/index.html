<script>
    // 搜索快捷键：/ 或 Ctrl/Cmd + K 聚焦搜索框，Esc 清空并退出
    (function () {
        function searchInput() {
            return document.querySelector('.sidebar .search input');
        }
        document.addEventListener('keydown', function (e) {
            var el = e.target;
            var tag = ((el && el.tagName) || '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || (el && el.isContentEditable)) return;
            var slash = e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey;
            var cmdK = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k';
            if (!slash && !cmdK) return;
            var input = searchInput();
            if (!input) return;
            e.preventDefault();
            input.focus();
            input.select();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            var input = searchInput();
            if (!input || document.activeElement !== input) return;
            input.value = '';
            input.dispatchEvent(new Event('input', {bubbles: true}));
            input.blur();
        });
    })();
</script>
<script>
    // 菜单栏、侧栏与侧栏分组的折叠状态
    (function () {
        var navBtn = document.getElementById('cj-nav-toggle');

        function syncNav() {
            if (!navBtn) return;
            var collapsed = document.body.classList.contains('cj-nav-collapsed');
            navBtn.setAttribute('aria-expanded', String(!collapsed));
            navBtn.setAttribute('title', collapsed ? '展开菜单' : '折叠菜单');
        }

        if (navBtn) {
            navBtn.addEventListener('click', function () {
                var collapsed = document.body.classList.toggle('cj-nav-collapsed');
                try {
                    localStorage.setItem('cj-nav-collapsed', collapsed ? '1' : '0');
                } catch (e) {}
                syncNav();
            });
            syncNav();
        }

        // 侧栏整体折叠复用 docsify 的 .sidebar-toggle + body.close
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.sidebar-toggle') || window.innerWidth <= 768) return;
            setTimeout(function () {
                try {
                    localStorage.setItem('cj-sidebar-collapsed', document.body.classList.contains('close') ? '1' : '0');
                } catch (err) {}
            }, 0);
        });

        // 侧栏分组折叠
        var GROUPS_KEY = 'cj-sidebar-groups';

        function savedGroups() {
            try {
                return JSON.parse(localStorage.getItem(GROUPS_KEY) || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveGroups(list) {
            try {
                localStorage.setItem(GROUPS_KEY, JSON.stringify(list));
            } catch (e) {}
        }

        function labelOf(li) {
            var el = li.querySelector(':scope > p') || li.querySelector(':scope > strong');
            return el ? el.textContent.trim() : '';
        }

        function applyGroups() {
            var list = savedGroups();
            document.querySelectorAll('.sidebar-nav li').forEach(function (li) {
                var label = li.querySelector(':scope > p') || li.querySelector(':scope > strong');
                var sub = li.querySelector(':scope > ul');
                if (!label || !sub) return;
                li.classList.add('cj-group');
                li.classList.toggle('cj-collapsed', list.indexOf(labelOf(li)) !== -1);
            });
        }

        document.addEventListener('click', function (e) {
            var label = e.target.closest('.sidebar-nav li > p, .sidebar-nav li > strong');
            if (!label) return;
            var li = label.parentElement;
            if (!li || !li.querySelector(':scope > ul')) return;
            e.preventDefault();
            var collapsed = li.classList.toggle('cj-collapsed');
            var name = labelOf(li);
            var list = savedGroups();
            var i = list.indexOf(name);
            if (collapsed && i < 0) list.push(name);
            if (!collapsed && i >= 0) list.splice(i, 1);
            saveGroups(list);
        });

        var groupTimer = null;
        var bodyObserver = new MutationObserver(function () {
            if (groupTimer) return;
            groupTimer = setTimeout(function () {
                groupTimer = null;
                applyGroups();
            }, 150);
        });
        bodyObserver.observe(document.body, {childList: true, subtree: true});
        applyGroups();
    })();
</script>
<script>
    // 文章末尾的分享条：不依赖第三方分享插件
    (function () {
        function encode(value) {
            return encodeURIComponent(value);
        }

        function shareUrl(kind, url, title) {
            switch (kind) {
                case 'weibo':
                    return 'https://service.weibo.com/share/share.php?url=' + encode(url) + '&title=' + encode(title);
                case 'x':
                    return 'https://twitter.com/intent/tweet?url=' + encode(url) + '&text=' + encode(title);
                case 'telegram':
                    return 'https://t.me/share/url?url=' + encode(url) + '&text=' + encode(title);
                case 'facebook':
                    return 'https://www.facebook.com/sharer/sharer.php?u=' + encode(url);
                case 'linkedin':
                    return 'https://www.linkedin.com/sharing/share-offsite/?url=' + encode(url);
                case 'reddit':
                    return 'https://www.reddit.com/submit?url=' + encode(url) + '&title=' + encode(title);
                default:
                    return '';
            }
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                var area = document.createElement('textarea');
                area.value = text;
                area.setAttribute('readonly', '');
                area.style.position = 'fixed';
                area.style.top = '-9999px';
                document.body.appendChild(area);
                area.select();
                try {
                    document.execCommand('copy') ? resolve() : reject(new Error('copy failed'));
                } catch (err) {
                    reject(err);
                } finally {
                    document.body.removeChild(area);
                }
            });
        }

        var toastTimer = null;

        function toast(block, message) {
            var el = block.querySelector('.cj-share__toast');
            if (!el) return;
            el.textContent = message;
            el.classList.add('is-show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                el.classList.remove('is-show');
            }, 2800);
        }

        function build() {
            var section = document.querySelector('.markdown-section');
            if (!section || section.querySelector('.cj-share')) return;

            var url = window.location.href;
            var title = document.title;
            var block = document.createElement('section');
            block.className = 'cj-share';
            block.setAttribute('aria-label', '分享这篇文章');
            block.innerHTML =
                '<div class="cj-share__head">' +
                '<span class="cj-share__title">分享这篇文章</span>' +
                '<span class="cj-share__hint">把这篇笔记发给同样在学的人</span>' +
                '</div>' +
                '<div class="cj-share__list">' +
                '<button class="cj-share__btn" type="button" data-share="wechat">微信</button>' +
                '<button class="cj-share__btn" type="button" data-share="weibo">微博</button>' +
                '<button class="cj-share__btn" type="button" data-share="x">X</button>' +
                '<button class="cj-share__btn" type="button" data-share="telegram">Telegram</button>' +
                '<button class="cj-share__btn" type="button" data-share="facebook">Facebook</button>' +
                '<button class="cj-share__btn" type="button" data-share="linkedin">LinkedIn</button>' +
                '<button class="cj-share__btn" type="button" data-share="reddit">Reddit</button>' +
                '<button class="cj-share__btn" type="button" data-share="copy">复制链接</button>' +
                '</div>' +
                '<p class="cj-share__toast" role="status" aria-live="polite"></p>';

            var anchor = section.querySelector('.giscus, .docsify-pagination-container');
            if (anchor) section.insertBefore(block, anchor);
            else section.appendChild(block);

            block.addEventListener('click', function (e) {
                var btn = e.target.closest('.cj-share__btn');
                if (!btn) return;
                var kind = btn.getAttribute('data-share');

                if (kind === 'wechat' || kind === 'copy') {
                    copyText(url).then(
                        function () {
                            if (kind === 'wechat') {
                                toast(block, '链接已复制，打开微信粘贴给朋友');
                                return;
                            }
                            var original = btn.textContent;
                            btn.textContent = '已复制';
                            btn.classList.add('is-done');
                            setTimeout(function () {
                                btn.textContent = original;
                                btn.classList.remove('is-done');
                            }, 1800);
                        },
                        function () {
                            toast(block, '复制失败，请手动复制地址栏链接');
                        },
                    );
                    return;
                }

                var href = shareUrl(kind, url, title);
                if (href) window.open(href, '_blank', 'noopener,noreferrer,width=640,height=560');
            });
        }

        var timer = null;
        new MutationObserver(function () {
            if (timer) return;
            timer = setTimeout(function () {
                timer = null;
                build();
            }, 200);
        }).observe(document.body, {childList: true, subtree: true});
        build();
    })();
</script>
